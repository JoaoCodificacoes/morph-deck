# morph-deck template config for neutral.pptx (generated by `morphdeck inspect`, then checked by hand)
[template]
file = "neutral.pptx"

[layouts]
cover = 0      # Title Slide
content = 5    # Title Only
end = 0        # Title Slide again, for the closing slide

[placeholders]
title = 0
slide_number = 12
keep = [1]     # the cover's subtitle

[area]
x = 0.74
y = 1.75
w = 11.86
h = 4.85

[fonts]
body = "Aptos"
head = "Aptos Display"
title_size = 30

[identities]
# one colour per thread of the talk: base, tint, dark. Declare them in your deck's own config.
